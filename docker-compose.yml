services:
  db:
    image: postgres:16-alpine
    container_name: indicomp-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indicomp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indicomp_password}
      POSTGRES_DB: ${POSTGRES_DB:-indicomp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indicomp_user} -d ${POSTGRES_DB:-indicomp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: indicomp-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-indicomp_user}:${POSTGRES_PASSWORD:-indicomp_password}@db:5432/${POSTGRES_DB:-indicomp_db}
      ENABLE_SEMANTIC_SEARCH: "false"
      ENABLE_LLM_EXPLAINER: "false"
      LLM_PROVIDER: "ollama"
      LLM_API_BASE: "http://host.docker.internal:11434"
      MAX_UPLOAD_SIZE_MB: "10"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/generated_reports:/app/generated_reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indicomp-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    ports:
      - "3000:80"

volumes:
  postgres_data:
